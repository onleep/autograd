services:
  parser:
    build:
      context: .
      args:
        APP_NAME: parser
    restart: on-failure:1
    depends_on:
      minio:
        condition: service_healthy
      mysql:
        condition: service_healthy
    volumes:
      - ./logs/parser:/app/logs
  vlm:
    image: vllm/vllm-openai:v0.20.2
    depends_on:
      - parser
    command: >
      Qwen/Qwen3-VL-4B-Instruct-FP8
      --gpu-memory-utilization 0.85
      --max-model-len 8192
    ipc: host
    gpus: all
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
  ml:
    build:
      context: .
      args:
        APP_NAME: ml
    depends_on:
      - vlm
    volumes:
      - ./logs/ml:/app/logs
  api:
    build:
      context: .
      args:
        APP_NAME: api
    ports:
      - 8000:8000
    depends_on:
      - ml
    volumes:
      - ./logs/api:/app/logs
  frontend:
    build:
      context: .
      args:
        APP_NAME: frontend
    depends_on:
      - api
    volumes:
      - ./logs/frontend:/app/logs
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    ports:
      - 9000:9000
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ID}
      MINIO_ROOT_PASSWORD: ${S3_KEY}
    volumes:
      - minio:/data
    healthcheck:
      test: mc ready local
      interval: 1s
      retries: 10
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    ports:
      - 3310:3306
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: MYSQL_PWD=${DB_PASS} mysql -e 'SELECT 1'
      interval: 1s
      retries: 10
  phpmyadmin:
    image: phpmyadmin:5.2.3
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
  grafana:
    image: grafana/grafana:12.4.0-19291686361
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_NAME}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASS}
    volumes:
      - grafana:/var/lib/grafana
  caddy:
    image: caddy:latest
    ports:
      - 80:80
      - 443:443
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
volumes:
  minio: null
  mysql: null
  grafana: null
  caddy_data: null
  caddy_config: null
